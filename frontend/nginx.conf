# Only forward `Connection: upgrade` for real WebSocket upgrades; plain API
# calls get a normal keep-alive connection to the backend.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json;

  # Close idle browser connections before NAT/firewalls along the way silently
  # drop them. Otherwise the browser reuses a dead connection after the page
  # has been idle (e.g. editing in the canvas) and the next request hangs for
  # the TCP retransmission timeout and fails with "Failed to fetch".
  keepalive_timeout 15s;

  # Match the backend bodyLimit (50 MB, base64 uploads). nginx's 1 MB default
  # would reset the connection on larger request bodies.
  client_max_body_size 50m;

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # API proxy — API_UPSTREAM is set by the container orchestrator / docker-compose
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location /health { return 200 'ok'; add_header Content-Type text/plain; }
}
